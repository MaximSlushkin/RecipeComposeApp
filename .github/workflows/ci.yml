name: Android CI

# Запуск при push и pull request в основную ветку (main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Отмена предыдущих запусков для той же ветки/PR (экономит ресурсы)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установка JDK 17 (требование AGP 9+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Принятие лицензий Android SDK (нужно для compileSdk 36)
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Кеширование Gradle (учитываем libs.versions.toml)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Предоставление прав на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Запуск unit-тестов
      - name: Run unit tests
        run: ./gradlew test

      # 7. Запуск линтера (Android Lint)
      - name: Run lint
        run: ./gradlew lint

      # 8. Сборка debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 9. Загрузка артефактов (отчёты о тестах, линтере, APK)
      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint/

      - name: Upload debug APK (always)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # (Опционально) Покрытие кода с отправкой в Codecov
  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test   # запускаем после успешных тестов
    # Выполняем только если есть секрет CODECOV_TOKEN
    if: secrets.CODECOV_TOKEN != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Генерация отчёта JaCoCo (задача уже определена в app/build.gradle.kts)
      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport

      # Загрузка отчёта в Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false   # чтобы не ломать сборку при проблемах с загрузкой